<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#faf9fd" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121318" media="(prefers-color-scheme: dark)">
<meta name="htmx-config" content='{"includeIndicatorStyles":false,"scrollIntoViewOnBoost":false,"historyCacheSize":0,"refreshOnHistoryMiss":true,"attributesToSettle":["class","width","height"],"allowEval":false,"allowScriptTags":false}'>
<title>{{.Title}} · Ordo</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="{{asset "icon.svg"}}" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{asset "icon-192.png"}}">
<link rel="stylesheet" href="{{asset "app.css"}}">
<script src="{{asset "htmx.min.js"}}" defer></script>
<script src="{{asset "app.js"}}" defer></script>
</head>
<body class="{{.Body}}" hx-boost="true" hx-target="#app" hx-select="#app" hx-swap="outerHTML">
{{template "content" .}}
<div id="snackbar" class="snackbar" role="status" aria-live="polite" hidden>
  <span class="snackbar-text"></span>
  <button type="button" class="snackbar-action" hidden>Undo</button>
</div>
</body>
</html>
