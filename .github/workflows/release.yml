name: Release

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: write

jobs:
    # VERSION is the source for the nix package version, while the tag stamps
    # the Go binaries and AUR packages; a release where the two disagree must
    # not ship anything.
    check-version:
        runs-on: ubuntu-latest
        outputs:
            android-version-code: ${{ steps.android.outputs.code }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Check VERSION matches tag
              run: test "$(cat VERSION)" = "${GITHUB_REF_NAME#v}"

            - name: Check CHANGELOG.md has notes for the tag
              run: scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > /dev/null

            # Android refuses an update whose versionCode is not above the installed one, and a
            # shipped code can never come back down.
            - name: Derive the Android versionCode from the tag
              id: android
              run: |
                  if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                      echo "::error::Tag '$GITHUB_REF_NAME' is not vMAJOR.MINOR.PATCH, so no Android versionCode can be derived from it."
                      exit 1
                  fi
                  major="${BASH_REMATCH[1]}" minor="${BASH_REMATCH[2]}" patch="${BASH_REMATCH[3]}"
                  if (( minor > 99 || patch > 99 )); then
                      echo "::error::Tag '$GITHUB_REF_NAME' overflows the versionCode encoding (minor and patch must each stay under 100). Bump the component to its left instead."
                      exit 1
                  fi
                  echo "code=$(( major * 10000 + minor * 100 + patch ))" >> "$GITHUB_OUTPUT"

    build:
        needs: check-version
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Setup Go
              uses: actions/setup-go@v6
              with:
                  go-version: stable
                  cache: true

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2

            - name: Cache Bun packages
              uses: actions/cache@v6
              with:
                  path: ~/.bun/install/cache
                  key: bun-${{ runner.os }}-${{ hashFiles('app/bun.lock') }}
                  restore-keys: bun-${{ runner.os }}-

            - name: Build the app bundle
              run: scripts/web.sh

            - name: Build binaries
              env:
                  CGO_ENABLED: '0'
              run: |
                  version="${GITHUB_REF_NAME#v}"
                  commit="${GITHUB_SHA::7}"
                  build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                  ldflags="-s -w \
                      -X github.com/ilyasturki/ordo/internal/version.Version=v${version} \
                      -X github.com/ilyasturki/ordo/internal/version.Commit=${commit} \
                      -X github.com/ilyasturki/ordo/internal/version.BuildDate=${build_date}"

                  GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "$ldflags" -o ordo-linux-x64 ./cmd/ordo
                  GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "$ldflags" -o ordo-linux-arm64 ./cmd/ordo
                  GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags "$ldflags" -o ordo-darwin-x64 ./cmd/ordo
                  GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "$ldflags" -o ordo-darwin-arm64 ./cmd/ordo

            - name: Smoke test (linux-x64)
              run: scripts/smoke.sh ./ordo-linux-x64

            - name: Upload binaries
              uses: actions/upload-artifact@v7
              with:
                  name: binaries
                  path: |
                      ordo-linux-*
                      ordo-darwin-*

    github-release:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Download binaries
              uses: actions/download-artifact@v8
              with:
                  merge-multiple: true

            - name: Extract release notes
              run: scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > release-notes.md

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v3
              with:
                  body_path: release-notes.md
                  files: |
                      ordo-linux-*
                      ordo-darwin-*

    # Secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
    # The keystore can never change: Android refuses an update signed by another key.
    apk:
        needs: [check-version, github-release]
        runs-on: ubuntu-latest
        steps:
            - name: Check for the keystore
              id: keystore
              env:
                  ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
              run: |
                  if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
                      echo "enabled=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "::notice::ANDROID_KEYSTORE_BASE64 is not set, so no APK is built"
                  fi

            - name: Checkout code
              if: steps.keystore.outputs.enabled == 'true'
              uses: actions/checkout@v6

            - name: Setup Go
              if: steps.keystore.outputs.enabled == 'true'
              uses: actions/setup-go@v6
              with:
                  go-version: stable
                  cache: true

            # Android Gradle Plugin 8.13 (app/android/build.gradle) needs 17 at minimum, targets 21.
            - name: Setup Java
              if: steps.keystore.outputs.enabled == 'true'
              uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: '21'

            # Tracks app/android/variables.gradle: compileSdkVersion = 36.
            - name: Setup Android SDK
              if: steps.keystore.outputs.enabled == 'true'
              uses: android-actions/setup-android@v4
              with:
                  packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

            - name: Setup Gradle
              if: steps.keystore.outputs.enabled == 'true'
              uses: gradle/actions/setup-gradle@v6

            - name: Setup Bun
              if: steps.keystore.outputs.enabled == 'true'
              uses: oven-sh/setup-bun@v2

            - name: Cache Bun packages
              if: steps.keystore.outputs.enabled == 'true'
              uses: actions/cache@v6
              with:
                  path: ~/.bun/install/cache
                  key: bun-${{ runner.os }}-${{ hashFiles('app/bun.lock') }}
                  restore-keys: bun-${{ runner.os }}-

            - name: Build the app into the Android project
              if: steps.keystore.outputs.enabled == 'true'
              run: |
                  scripts/wasm.sh
                  cd app
                  bun install --frozen-lockfile
                  bun run android:sync

            - name: Assemble the signed APK
              if: steps.keystore.outputs.enabled == 'true'
              working-directory: app/android
              env:
                  KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
                  ORDO_KEYSTORE: ${{ runner.temp }}/ordo.jks
                  ORDO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
                  ORDO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
                  ORDO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
                  VERSION_CODE: ${{ needs.check-version.outputs.android-version-code }}
              run: |
                  printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$ORDO_KEYSTORE"
                  ./gradlew assembleRelease \
                      -PordoVersionName="${GITHUB_REF_NAME#v}" \
                      -PordoVersionCode="$VERSION_CODE"

            - name: Upload the APK to the release
              if: steps.keystore.outputs.enabled == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  out=app/android/app/build/outputs/apk/release
                  if [ ! -f "$out/app-release.apk" ]; then
                      echo "::error::No signed APK at $out/app-release.apk, only: $(cd "$out" && echo *). Gradle skipped signing: check the four ANDROID_* secrets."
                      exit 1
                  fi
                  apk="ordo-${GITHUB_REF_NAME#v}.apk"
                  mv "$out/app-release.apk" "$apk"
                  gh release upload "$GITHUB_REF_NAME" "$apk" --clobber

    homebrew:
        needs: github-release
        runs-on: ubuntu-latest
        steps:
            - name: Check for the tap token
              id: tap
              env:
                  HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
              run: |
                  if [ -n "$HOMEBREW_TAP_TOKEN" ]; then
                      echo "enabled=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "::notice::HOMEBREW_TAP_TOKEN is not set, so the Homebrew tap is not updated"
                  fi

            - name: Download binaries
              if: steps.tap.outputs.enabled == 'true'
              uses: actions/download-artifact@v8
              with:
                  name: binaries

            - name: Update Homebrew tap
              if: steps.tap.outputs.enabled == 'true'
              env:
                  HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
              run: |
                  version="${GITHUB_REF_NAME#v}"

                  darwin_arm64_sha=$(sha256sum ordo-darwin-arm64 | cut -d ' ' -f 1)
                  darwin_x64_sha=$(sha256sum ordo-darwin-x64 | cut -d ' ' -f 1)
                  linux_arm64_sha=$(sha256sum ordo-linux-arm64 | cut -d ' ' -f 1)
                  linux_x64_sha=$(sha256sum ordo-linux-x64 | cut -d ' ' -f 1)

                  git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/ilyasturki/homebrew-ordo.git" tap
                  mkdir -p tap/Formula

                  cat > tap/Formula/ordo.rb << RUBY
                  class Ordo < Formula
                    desc "Terminal-first, single-user project planning tool"
                    homepage "https://github.com/ilyasturki/ordo"
                    version "${version}"
                    license "MIT"

                    on_macos do
                      on_arm do
                        url "https://github.com/ilyasturki/ordo/releases/download/v#{version}/ordo-darwin-arm64"
                        sha256 "${darwin_arm64_sha}"
                      end
                      on_intel do
                        url "https://github.com/ilyasturki/ordo/releases/download/v#{version}/ordo-darwin-x64"
                        sha256 "${darwin_x64_sha}"
                      end
                    end

                    on_linux do
                      on_arm do
                        url "https://github.com/ilyasturki/ordo/releases/download/v#{version}/ordo-linux-arm64"
                        sha256 "${linux_arm64_sha}"
                      end
                      on_intel do
                        url "https://github.com/ilyasturki/ordo/releases/download/v#{version}/ordo-linux-x64"
                        sha256 "${linux_x64_sha}"
                      end
                    end

                    def install
                      binary = Dir.glob("ordo-*").first
                      chmod 0755, binary
                      bin.install binary => "ordo"
                      generate_completions_from_executable(bin/"ordo", "completion")
                    end

                    test do
                      assert_match version.to_s, shell_output("#{bin}/ordo --version")
                    end
                  end
                  RUBY

                  cd tap
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add Formula/ordo.rb
                  if git diff --cached --quiet; then
                      echo "Formula/ordo.rb already describes ${version}"
                      exit 0
                  fi
                  git commit -m "ordo ${version}"
                  git push -u origin HEAD

    aur:
        needs: github-release
        runs-on: ubuntu-latest
        steps:
            - name: Generate PKGBUILD
              run: |
                  version="${GITHUB_REF_NAME#v}"
                  src_sha=$(curl -sL "https://github.com/ilyasturki/ordo/archive/v${version}.tar.gz" | sha256sum | cut -d ' ' -f 1)

                  cat > PKGBUILD << 'HEREDOC'
                  # Maintainer: Ilyas Turki <ilyasturki at gmail dot com>
                  pkgname=ordo
                  pkgver=${VERSION}
                  pkgrel=1
                  pkgdesc="Terminal-first, single-user project planning tool"
                  arch=('x86_64' 'aarch64')
                  url="https://github.com/ilyasturki/ordo"
                  license=('MIT')
                  makedepends=('go')
                  provides=('ordo')
                  conflicts=('ordo-bin')
                  source=("${pkgname}-${pkgver}.tar.gz::${url}/archive/v${pkgver}.tar.gz")
                  sha256sums=('${SRC_SHA}')

                  prepare() {
                      cd "${pkgname}-${pkgver}"
                      mkdir -p build
                      export GOPATH="${srcdir}/gopath"
                      go mod download
                  }

                  build() {
                      cd "${pkgname}-${pkgver}"
                      export GOPATH="${srcdir}/gopath"
                      export CGO_CPPFLAGS="${CPPFLAGS}"
                      export CGO_CFLAGS="${CFLAGS}"
                      export CGO_CXXFLAGS="${CXXFLAGS}"
                      export CGO_LDFLAGS="${LDFLAGS}"
                      go build \
                          -trimpath \
                          -buildmode=pie \
                          -mod=readonly \
                          -modcacherw \
                          -ldflags "-s -w -linkmode=external -X github.com/ilyasturki/ordo/internal/version.Version=v${pkgver}" \
                          -o build/ordo \
                          ./cmd/ordo
                  }

                  package() {
                      cd "${pkgname}-${pkgver}"
                      install -Dm755 build/ordo "${pkgdir}/usr/bin/ordo"
                      install -Dm644 LICENSE "${pkgdir}/usr/share/licenses/${pkgname}/LICENSE"

                      "${pkgdir}/usr/bin/ordo" completion bash | install -Dm644 /dev/stdin "${pkgdir}/usr/share/bash-completion/completions/ordo"
                      "${pkgdir}/usr/bin/ordo" completion zsh | install -Dm644 /dev/stdin "${pkgdir}/usr/share/zsh/site-functions/_ordo"
                      "${pkgdir}/usr/bin/ordo" completion fish | install -Dm644 /dev/stdin "${pkgdir}/usr/share/fish/vendor_completions.d/ordo.fish"
                  }
                  HEREDOC

                  sed -i "s/\${VERSION}/${version}/g" PKGBUILD
                  sed -i "s/\${SRC_SHA}/${src_sha}/g" PKGBUILD

            - name: Publish to AUR
              uses: KSXGitHub/github-actions-deploy-aur@v4.1.2
              with:
                  pkgname: ordo
                  pkgbuild: ./PKGBUILD
                  commit_username: Ilyas Turki
                  commit_email: ilyasturki@gmail.com
                  ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
                  commit_message: ${{ github.ref_name }}
                  force_push: true

    aur-bin:
        needs: github-release
        runs-on: ubuntu-latest
        steps:
            - name: Download binaries
              uses: actions/download-artifact@v8
              with:
                  name: binaries

            - name: Generate PKGBUILD
              run: |
                  version="${GITHUB_REF_NAME#v}"
                  x64_sha=$(sha256sum ordo-linux-x64 | cut -d ' ' -f 1)
                  arm64_sha=$(sha256sum ordo-linux-arm64 | cut -d ' ' -f 1)

                  cat > PKGBUILD << 'HEREDOC'
                  # Maintainer: Ilyas Turki <ilyasturki at gmail dot com>
                  pkgname=ordo-bin
                  pkgver=${VERSION}
                  pkgrel=1
                  pkgdesc="Terminal-first, single-user project planning tool"
                  arch=('x86_64' 'aarch64')
                  url="https://github.com/ilyasturki/ordo"
                  license=('MIT')
                  depends=('glibc')
                  provides=('ordo')
                  conflicts=('ordo')
                  options=('!strip')

                  source=("LICENSE-${pkgver}::${url}/raw/v${pkgver}/LICENSE")
                  source_x86_64=("${pkgname}-${pkgver}-x86_64::${url}/releases/download/v${pkgver}/ordo-linux-x64")
                  source_aarch64=("${pkgname}-${pkgver}-aarch64::${url}/releases/download/v${pkgver}/ordo-linux-arm64")
                  sha256sums=('SKIP')
                  sha256sums_x86_64=('${X64_SHA}')
                  sha256sums_aarch64=('${ARM64_SHA}')

                  package() {
                      install -Dm755 "${pkgname}-${pkgver}-${CARCH}" "${pkgdir}/usr/bin/ordo"
                      install -Dm644 "LICENSE-${pkgver}" "${pkgdir}/usr/share/licenses/${pkgname}/LICENSE"

                      "${pkgdir}/usr/bin/ordo" completion bash | install -Dm644 /dev/stdin "${pkgdir}/usr/share/bash-completion/completions/ordo"
                      "${pkgdir}/usr/bin/ordo" completion zsh | install -Dm644 /dev/stdin "${pkgdir}/usr/share/zsh/site-functions/_ordo"
                      "${pkgdir}/usr/bin/ordo" completion fish | install -Dm644 /dev/stdin "${pkgdir}/usr/share/fish/vendor_completions.d/ordo.fish"
                  }
                  HEREDOC

                  sed -i "s/\${VERSION}/${version}/g" PKGBUILD
                  sed -i "s/\${X64_SHA}/${x64_sha}/g" PKGBUILD
                  sed -i "s/\${ARM64_SHA}/${arm64_sha}/g" PKGBUILD

            - name: Publish to AUR
              uses: KSXGitHub/github-actions-deploy-aur@v4.1.2
              with:
                  pkgname: ordo-bin
                  pkgbuild: ./PKGBUILD
                  commit_username: Ilyas Turki
                  commit_email: ilyasturki@gmail.com
                  ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
                  commit_message: ${{ github.ref_name }}
                  force_push: true
