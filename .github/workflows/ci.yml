name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Setup Go
              uses: actions/setup-go@v6
              with:
                  go-version: stable
                  cache: true

            - name: Vet
              run: go vet ./...

            - name: Test
              run: go test ./...

            - name: Build
              run: go build -o ordo ./cmd/ordo

            - name: Smoke test
              run: scripts/smoke.sh ./ordo

    native:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            # aapt2 is the first parser to read these, minutes into the release APK build.
            - name: Parse the Android resource XML
              run: |
                  python3 - <<'PY'
                  import pathlib, sys, xml.dom.minidom

                  broken = []
                  for path in sorted(pathlib.Path('native/android/app/src').rglob('*.xml')):
                      try:
                          xml.dom.minidom.parse(str(path))
                      except Exception as error:
                          broken.append(f'::error file={path}::{error}')

                  print('\n'.join(broken))
                  sys.exit(1 if broken else 0)
                  PY

            - name: Setup Go
              uses: actions/setup-go@v6
              with:
                  go-version: stable
                  cache: true
                  cache-dependency-path: |
                      go.sum
                      native/core/go.sum

            # Android Gradle Plugin 9.5 (native/android/gradle/libs.versions.toml) needs 17 at minimum.
            - name: Setup Java
              uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: '21'

            # Tracks nix/android-sdk.nix.
            - name: Setup Android SDK
              uses: android-actions/setup-android@v4
              with:
                  packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;29.0.14206865'

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v6

            - name: Test
              run: scripts/native.sh test
              env:
                  ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865

            # Unsigned, without the release job's keystore: R8 and the resources, on every push rather than first at a tag.
            - name: Build the release APK
              run: native/android/gradlew -p native/android assembleRelease

            - name: Check the release leaves out the adb sign-in
              run: |
                  apk=native/android/app/build/outputs/apk/release/app-release-unsigned.apk
                  manifest=$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump xmltree --file AndroidManifest.xml "$apk")
                  if grep -q DevSignInActivity <<<"$manifest"; then
                      echo "::error::$apk declares DevSignInActivity"
                      exit 1
                  fi

    nix-build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Install Nix
              uses: DeterminateSystems/nix-installer-action@main

            - name: Cache Nix store
              uses: DeterminateSystems/magic-nix-cache-action@main
              with:
                  use-flakehub: false

            - name: Build
              run: nix build

            - name: Smoke test
              run: scripts/smoke.sh ./result/bin/ordo
